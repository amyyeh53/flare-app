<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0ede6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash {
      text-align: center;
      padding: 40px 24px;
    }

    .logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #f0ede6;
      margin-bottom: 8px;
    }

    .logo span {
      color: #e8593c;
    }

    .tagline {
      font-size: 15px;
      color: #888;
      margin-bottom: 40px;
    }

    .status {
      display: inline-block;
      font-size: 13px;
      color: #555;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Fl<span>a</span>re</div>
    <div class="tagline">Track food. Spot triggers.</div>
    <div class="status">Setting up…</div>
  </div>
</body>
</html>
